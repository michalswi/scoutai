<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f2f7"/>
      <stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#00000020"/>
    </filter>
    <filter id="shadowSide" x="-10%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="2" dy="0" stdDeviation="8" flood-color="#00000015"/>
    </filter>
    <clipPath id="appClip">
      <rect x="20" y="20" width="1160" height="760" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#e8e8ed"/>

  <!-- App Window -->
  <rect x="20" y="20" width="1160" height="760" rx="16" fill="#f2f2f7" filter="url(#shadow)"/>

  <!-- Title bar / traffic lights area -->
  <rect x="20" y="20" width="1160" height="44" rx="16" fill="#ffffff"/>
  <rect x="20" y="48" width="1160" height="16" fill="#ffffff"/>

  <!-- Traffic light buttons -->
  <circle cx="52" cy="42" r="7" fill="#ff5f57"/>
  <circle cx="76" cy="42" r="7" fill="#febc2e"/>
  <circle cx="100" cy="42" r="7" fill="#28c840"/>

  <!-- Window title -->
  <text x="600" y="47" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#1c1c1e" text-anchor="middle">scoutai</text>

  <!-- Divider under titlebar -->
  <line x1="20" y1="64" x2="1180" y2="64" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- ===== TAB BAR ===== -->
  <!-- Segmented tab pill container -->
  <rect x="20" y="64" width="1160" height="52" fill="#f9f9fb"/>
  <line x1="20" y1="116" x2="1180" y2="116" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Active tab pill: owrap -->
  <rect x="36" y="74" width="160" height="32" rx="10" fill="#007AFF"/>
  <image href="img/logo.png" x="48" y="81" width="18" height="18"/>
  <text x="120" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">owrap</text>
  <!-- status dot on active tab -->
  <circle cx="190" cy="90" r="4" fill="#34c759"/>

  <!-- Inactive tab: OpenStreetMap -->
  <rect x="208" y="74" width="175" height="32" rx="10" fill="none"/>
  <text x="295" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#8e8e93" text-anchor="middle">🗺️ OpenStreetMap</text>

  <!-- Inactive tab: Google Maps -->
  <rect x="395" y="74" width="175" height="32" rx="10" fill="none"/>
  <text x="482" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#8e8e93" text-anchor="middle">🌎 Google Maps</text>

  <!-- Inactive tab: Shell Executor -->
  <rect x="582" y="74" width="165" height="32" rx="10" fill="none"/>
  <text x="664" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#8e8e93" text-anchor="middle">⚡ Shell Executor</text>

  <!-- Theme toggle button -->
  <rect x="1114" y="74" width="50" height="32" rx="10" fill="#e5e5ea"/>
  <text x="1139" y="95" font-family="sans-serif" font-size="16" text-anchor="middle">🌙</text>

  <!-- ===== CONTENT AREA ===== -->
  <!-- Left sidebar -->
  <rect x="20" y="116" width="220" height="644" fill="#f9f9fb" filter="url(#shadowSide)"/>
  <line x1="240" y1="116" x2="240" y2="760" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Sidebar logo area -->
  <rect x="28" y="124" width="204" height="52" rx="10" fill="none"/>
  <rect x="28" y="124" width="44" height="44" rx="10" fill="#007AFF"/>
  <text x="50" y="151" font-family="sans-serif" font-size="20" fill="white" text-anchor="middle">🤖</text>
  <text x="108" y="141" font-family="-apple-system, SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#1c1c1e">scoutai</text>
  <text x="108" y="158" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#8e8e93">AI Assistant</text>

  <!-- Sidebar divider -->
  <line x1="36" y1="184" x2="228" y2="184" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Sidebar section label -->
  <text x="40" y="204" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" letter-spacing="0.5">TOOLS</text>

  <!-- Sidebar item 1: Activity Monitor (hover state) -->
  <rect x="28" y="210" width="202" height="44" rx="10" fill="#007AFF" opacity="0.12"/>
  <text x="52" y="230" font-family="sans-serif" font-size="17">🧠</text>
  <text x="78" y="232" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#007AFF">Activity Monitor</text>
  <text x="222" y="232" font-family="sans-serif" font-size="11" fill="#007AFF" text-anchor="end">›</text>

  <!-- Sidebar item 2: Run Locally -->
  <rect x="28" y="260" width="202" height="44" rx="10" fill="none"/>
  <text x="52" y="280" font-family="sans-serif" font-size="17">🦙</text>
  <text x="78" y="282" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#3a3a3c">Run Locally</text>
  <circle cx="206" cy="280" r="4" fill="#8e8e93"/>
  <text x="222" y="282" font-family="sans-serif" font-size="11" fill="#8e8e93" text-anchor="end">›</text>

  <!-- Sidebar item 3: Ollama Controls -->
  <rect x="28" y="310" width="202" height="44" rx="10" fill="none"/>
  <text x="52" y="330" font-family="sans-serif" font-size="17">⚙️</text>
  <text x="78" y="332" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#3a3a3c">Ollama Controls</text>
  <circle cx="206" cy="330" r="4" fill="#8e8e93"/>
  <text x="222" y="332" font-family="sans-serif" font-size="11" fill="#8e8e93" text-anchor="end">›</text>

  <!-- Sidebar divider -->
  <line x1="36" y1="364" x2="228" y2="364" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Sidebar section label: SESSIONS -->
  <text x="40" y="382" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#8e8e93" letter-spacing="0.5">SESSIONS</text>
  <rect x="28" y="390" width="202" height="36" rx="8" fill="#007AFF" opacity="0.12"/>
  <text x="52" y="413" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#007AFF">Session 1</text>
  <rect x="28" y="432" width="202" height="36" rx="8" fill="none"/>
  <text x="52" y="455" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#3a3a3c">Session 2</text>
  <rect x="194" y="440" width="28" height="16" rx="8" fill="#007AFF"/>
  <text x="208" y="452" font-family="-apple-system, SF Pro Text, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">+</text>

  <!-- ===== MAIN CONTENT AREA ===== -->
  <!-- Model config bar (collapsed/slim) -->
  <rect x="248" y="124" width="916" height="40" rx="10" fill="#ffffff" stroke="#d1d1d6" stroke-width="0.5"/>
  <text x="268" y="148" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#8e8e93">▸  session [model] configuration</text>
  <text x="1130" y="148" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#8e8e93" text-anchor="end">(per session)</text>

  <!-- Chat area -->
  <rect x="248" y="172" width="916" height="470" rx="12" fill="#ffffff"/>

  <!-- User message bubble -->
  <rect x="680" y="192" width="460" height="56" rx="16" fill="#007AFF"/>
  <text x="700" y="215" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="white">What are the best practices for container</text>
  <text x="700" y="234" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="white">security in Kubernetes?</text>

  <!-- AI response bubble -->
  <rect x="268" y="268" width="500" height="130" rx="16" fill="#f2f2f7"/>
  <text x="288" y="294" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#1c1c1e">Here are key Kubernetes security practices:</text>
  <text x="288" y="318" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#3a3a3c">1.  Use RBAC to restrict API access</text>
  <text x="288" y="338" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#3a3a3c">2.  Enable Pod Security Standards / Admission</text>
  <text x="288" y="358" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#3a3a3c">3.  Scan container images for vulnerabilities</text>
  <text x="288" y="378" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#3a3a3c">4.  Use network policies to limit pod traffic</text>

  <!-- Copy icon next to AI message -->
  <rect x="776" y="296" width="32" height="32" rx="8" fill="#e5e5ea"/>
  <text x="792" y="317" font-family="sans-serif" font-size="14" text-anchor="middle">📋</text>

  <!-- User message 2 -->
  <rect x="700" y="418" width="440" height="40" rx="16" fill="#007AFF"/>
  <text x="720" y="443" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="white">Can you show a NetworkPolicy example?</text>

  <!-- AI response 2 (code block style) -->
  <rect x="268" y="478" width="560" height="130" rx="16" fill="#f2f2f7"/>
  <rect x="276" y="486" width="544" height="114" rx="10" fill="#1c1c1e"/>
  <text x="296" y="508" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#30d158">apiVersion: networking.k8s.io/v1</text>
  <text x="296" y="526" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#30d158">kind: NetworkPolicy</text>
  <text x="296" y="544" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#64d2ff">metadata:</text>
  <text x="296" y="562" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#fff">  name: allow-same-namespace</text>
  <text x="296" y="580" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#64d2ff">spec:</text>

  <!-- ===== INPUT AREA ===== -->
  <rect x="248" y="650" width="916" height="92" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Recent prompts row -->
  <text x="266" y="670" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#8e8e93">Recent</text>
  <rect x="316" y="657" width="220" height="22" rx="6" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="0.5"/>
  <text x="328" y="672" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#8e8e93">-- Select a recent prompt --</text>

  <!-- Main text input -->
  <rect x="260" y="683" width="720" height="36" rx="10" fill="#f2f2f7"/>
  <text x="275" y="706" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#8e8e93">Type your message here...</text>

  <!-- Action buttons row -->
  <!-- Send button (primary blue) -->
  <rect x="988" y="683" width="80" height="36" rx="10" fill="#007AFF"/>
  <text x="1028" y="706" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Send ↑</text>

  <!-- Secondary buttons -->
  <rect x="988" y="683" width="80" height="36" rx="10" fill="#007AFF"/>
  <rect x="900" y="659" width="78" height="28" rx="8" fill="none" stroke="#d1d1d6" stroke-width="0.5"/>
  <text x="940" y="677" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#3a3a3c" text-anchor="middle">🎯 Focus</text>
  <rect x="820" y="659" width="74" height="28" rx="8" fill="none" stroke="#d1d1d6" stroke-width="0.5"/>
  <text x="857" y="677" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#3a3a3c" text-anchor="middle">💾 Save</text>

  <!-- Bottom label -->
  <text x="600" y="790" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#8e8e93" text-anchor="middle">Mockup: owrap (AI Chat) Tab — Apple-style Light Mode</text>
</svg>
