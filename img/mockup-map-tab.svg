<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#00000020"/>
    </filter>
    <filter id="mapShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00000025"/>
    </filter>
  </defs>

  <!-- Background (macOS desktop-like granite) -->
  <rect x="0" y="0" width="1200" height="800" fill="#e8e8ed"/>

  <!-- App window -->
  <rect x="20" y="20" width="1160" height="760" rx="16" fill="#f2f2f7" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="1160" height="44" rx="16" fill="#ffffff"/>
  <rect x="20" y="48" width="1160" height="16" fill="#ffffff"/>
  <circle cx="52" cy="42" r="7" fill="#ff5f57"/>
  <circle cx="76" cy="42" r="7" fill="#febc2e"/>
  <circle cx="100" cy="42" r="7" fill="#28c840"/>
  <text x="600" y="47" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#1c1c1e" text-anchor="middle">scoutai — OpenStreetMap</text>

  <!-- Divider -->
  <line x1="20" y1="64" x2="1180" y2="64" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Tab bar -->
  <rect x="20" y="64" width="1160" height="52" fill="#f9f9fb"/>
  <line x1="20" y1="116" x2="1180" y2="116" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Tab: owrap (inactive) -->
  <rect x="36" y="74" width="130" height="32" rx="10" fill="none"/>
  <text x="101" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#8e8e93" text-anchor="middle">🤖 owrap</text>

  <!-- Active tab: OpenStreetMap -->
  <rect x="178" y="74" width="175" height="32" rx="10" fill="#007AFF"/>
  <text x="265" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">🗺️ OpenStreetMap</text>

  <!-- Tab: Google Maps -->
  <rect x="365" y="74" width="175" height="32" rx="10" fill="none"/>
  <text x="452" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#8e8e93" text-anchor="middle">🌎 Google Maps</text>

  <!-- Tab: Shell Executor -->
  <rect x="552" y="74" width="165" height="32" rx="10" fill="none"/>
  <text x="634" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#8e8e93" text-anchor="middle">⚡ Shell Executor</text>

  <!-- Theme toggle -->
  <rect x="1114" y="74" width="50" height="32" rx="10" fill="#e5e5ea"/>
  <text x="1139" y="95" font-family="sans-serif" font-size="16" text-anchor="middle">🌙</text>

  <!-- ===== OSM CONTENT ===== -->
  <!-- Search toolbar strip -->
  <rect x="28" y="124" width="1144" height="60" fill="#ffffff" rx="12" y="124"/>
  <!-- Hmm, let me position better -->
  <rect x="28" y="126" width="1144" height="58" rx="12" fill="#ffffff" stroke="#d1d1d6" stroke-width="0.5"/>

  <!-- Search input field -->
  <rect x="40" y="137" width="520" height="34" rx="10" fill="#f2f2f7"/>
  <text x="60" y="159" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#8e8e93">🔍  Search for a place (e.g., Tokyo, Japan)...</text>
  <!-- Search Button -->
  <rect x="568" y="137" width="90" height="34" rx="10" fill="#007AFF"/>
  <text x="613" y="159" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Search</text>

  <!-- Map Style select -->
  <rect x="676" y="137" width="170" height="34" rx="10" fill="#f2f2f7"/>
  <text x="696" y="159" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#3a3a3c">🗺️  OpenStreetMap</text>
  <text x="836" y="159" font-family="sans-serif" font-size="10" fill="#8e8e93" text-anchor="end">▾</text>

  <!-- Coord inputs -->
  <rect x="862" y="137" width="100" height="34" rx="10" fill="#f2f2f7"/>
  <text x="912" y="159" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#8e8e93" text-anchor="middle">Latitude</text>
  <rect x="970" y="137" width="100" height="34" rx="10" fill="#f2f2f7"/>
  <text x="1020" y="159" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#8e8e93" text-anchor="middle">Longitude</text>
  <rect x="1078" y="137" width="50" height="34" rx="10" fill="#34c759"/>
  <text x="1103" y="159" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">📍</text>

  <!-- MAP AREA (simulated) -->
  <!-- Outer container with rounded corners and subtle shadow -->
  <rect x="28" y="196" width="1144" height="488" rx="14" fill="#c8d8e8" stroke="#d1d1d6" stroke-width="0.5" filter="url(#mapShadow)"/>

  <!-- Map tiles (simulated grid) -->
  <rect x="28" y="196" width="1144" height="488" rx="14" fill="#d4e3f0"/>

  <!-- Simulated map content - land mass -->
  <rect x="28" y="340" width="1144" height="344" rx="0" fill="#d4e3c8" opacity="0.7"/>
  <rect x="28" y="360" width="500" height="324" rx="0" fill="#d4e3c8" opacity="0.8"/>

  <!-- Roads on map -->
  <line x1="28" y1="450" x2="1172" y2="410" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <line x1="28" y1="500" x2="1172" y2="480" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="400" y1="196" x2="380" y2="684" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <line x1="700" y1="196" x2="720" y2="684" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <!-- Buildings (simulated) -->
  <rect x="140" y="340" width="40" height="50" rx="2" fill="#c8c8c8" opacity="0.8"/>
  <rect x="188" y="355" width="60" height="35" rx="2" fill="#c8c8c8" opacity="0.8"/>
  <rect x="255" y="330" width="30" height="60" rx="2" fill="#c8c8c8" opacity="0.8"/>
  <rect x="730" y="400" width="45" height="40" rx="2" fill="#c8c8c8" opacity="0.8"/>
  <rect x="782" y="390" width="35" height="50" rx="2" fill="#c8c8c8" opacity="0.8"/>

  <!-- Water body -->
  <ellipse cx="900" cy="330" rx="200" ry="80" fill="#a8c8e8" opacity="0.7"/>

  <!-- Green parks -->
  <rect x="480" y="440" width="80" height="60" rx="4" fill="#a8c89a" opacity="0.8"/>
  <rect x="820" y="500" width="100" height="70" rx="4" fill="#a8c89a" opacity="0.8"/>

  <!-- Map pin (center) -->
  <circle cx="600" cy="440" r="14" fill="#007AFF" opacity="0.95"/>
  <circle cx="600" cy="440" r="6" fill="#ffffff"/>
  <!-- Pin shadow -->
  <ellipse cx="600" cy="458" rx="8" ry="4" fill="#00000030"/>

  <!-- Fullscreen button (overlay on map) -->
  <rect x="1136" y="204" width="30" height="30" rx="8" fill="#ffffff" opacity="0.9" stroke="#d1d1d6" stroke-width="0.5"/>
  <text x="1151" y="224" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#3a3a3c">⛶</text>

  <!-- Leaflet attribution (subtle) -->
  <text x="1164" y="678" font-family="-apple-system, SF Pro Text, sans-serif" font-size="10" fill="#00000060" text-anchor="end">© OpenStreetMap contributors</text>

  <!-- Info bar bottom -->
  <rect x="28" y="692" width="1144" height="34" rx="10" fill="#ffffff" stroke="#d1d1d6" stroke-width="0.5"/>
  <text x="44" y="713" font-family="'Menlo', 'SF Mono', monospace" font-size="12" fill="#3a3a3c">Click on map to get coordinates</text>

  <!-- Saved Locations button -->
  <rect x="900" y="698" width="166" height="22" rx="8" fill="#007AFF" opacity="0.12"/>
  <text x="983" y="713" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#007AFF" text-anchor="middle">📘 Saved Locations (3)</text>

  <!-- Find Me button -->
  <rect x="1074" y="698" width="90" height="22" rx="8" fill="#34c759" opacity="0.15"/>
  <text x="1119" y="713" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#34c759" text-anchor="middle">📡 Find Me</text>

  <!-- Bottom label / page title -->
  <text x="600" y="790" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#8e8e93" text-anchor="middle">Mockup: OpenStreetMap Tab — Apple-style Light Mode</text>
</svg>
