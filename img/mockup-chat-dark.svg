<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#00000040"/>
    </filter>
    <filter id="shadowSide">
      <feDropShadow dx="2" dy="0" stdDeviation="8" flood-color="#00000020"/>
    </filter>
    <!-- glass blur simulation via opacity -->
  </defs>

  <!-- macOS dark desktop -->
  <rect x="0" y="0" width="1200" height="800" fill="#1a1a1d"/>

  <!-- App Window (dark) -->
  <rect x="20" y="20" width="1160" height="760" rx="16" fill="#1c1c1e" filter="url(#shadow)"/>

  <!-- Title bar (dark vibrancy) -->
  <rect x="20" y="20" width="1160" height="44" rx="16" fill="#2c2c2e"/>
  <rect x="20" y="48" width="1160" height="16" fill="#2c2c2e"/>
  <circle cx="52" cy="42" r="7" fill="#ff5f57"/>
  <circle cx="76" cy="42" r="7" fill="#febc2e"/>
  <circle cx="100" cy="42" r="7" fill="#28c840"/>
  <text x="600" y="47" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#f5f5f7" text-anchor="middle">scoutai</text>

  <!-- Divider -->
  <line x1="20" y1="64" x2="1180" y2="64" stroke="#38383a" stroke-width="0.5"/>

  <!-- Tab bar (dark) -->
  <rect x="20" y="64" width="1160" height="52" fill="#242426"/>
  <line x1="20" y1="116" x2="1180" y2="116" stroke="#38383a" stroke-width="0.5"/>

  <!-- Active tab: owrap (blue on dark) -->
  <rect x="36" y="74" width="140" height="32" rx="10" fill="#0a84ff"/>
  <text x="106" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">🤖 owrap</text>
  <circle cx="170" cy="90" r="4" fill="#32d74b"/>

  <!-- Inactive tabs -->
  <text x="280" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#636366" text-anchor="middle">🗺️ OpenStreetMap</text>
  <text x="465" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#636366" text-anchor="middle">🌎 Google Maps</text>
  <text x="640" y="94" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#636366" text-anchor="middle">⚡ Shell Executor</text>

  <!-- Theme toggle (dark mode active = moon) -->
  <rect x="1114" y="74" width="50" height="32" rx="10" fill="#38383a"/>
  <text x="1139" y="95" font-family="sans-serif" font-size="16" text-anchor="middle">☀️</text>

  <!-- ===== LEFT SIDEBAR (glassy dark) ===== -->
  <rect x="20" y="116" width="220" height="644" fill="#242426"/>
  <line x1="240" y1="116" x2="240" y2="760" stroke="#38383a" stroke-width="0.5"/>

  <!-- Sidebar logo -->
  <rect x="28" y="126" width="44" height="44" rx="12" fill="#0a84ff"/>
  <text x="50" y="154" font-family="sans-serif" font-size="22" fill="white" text-anchor="middle">🤖</text>
  <text x="88" y="141" font-family="-apple-system, SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#f5f5f7">scoutai</text>
  <text x="88" y="158" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#636366">AI Assistant</text>

  <line x1="36" y1="184" x2="228" y2="184" stroke="#38383a" stroke-width="0.5"/>
  <text x="40" y="204" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#636366" letter-spacing="0.5">TOOLS</text>

  <!-- Active sidebar item -->
  <rect x="28" y="210" width="202" height="44" rx="10" fill="#0a84ff" opacity="0.2"/>
  <text x="52" y="230" font-family="sans-serif" font-size="17">🧠</text>
  <text x="78" y="232" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#0a84ff">Activity Monitor</text>
  <text x="222" y="232" font-family="sans-serif" font-size="11" fill="#0a84ff" text-anchor="end">›</text>

  <rect x="28" y="260" width="202" height="44" rx="10" fill="none"/>
  <text x="52" y="280" font-family="sans-serif" font-size="17">🦙</text>
  <text x="78" y="282" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#ebebf5" opacity="0.8">Run Locally</text>
  <circle cx="206" cy="280" r="4" fill="#636366"/>
  <text x="222" y="282" font-family="sans-serif" font-size="11" fill="#636366" text-anchor="end">›</text>

  <rect x="28" y="310" width="202" height="44" rx="10" fill="none"/>
  <text x="52" y="330" font-family="sans-serif" font-size="17">⚙️</text>
  <text x="78" y="332" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="500" fill="#ebebf5" opacity="0.8">Ollama Controls</text>
  <circle cx="206" cy="330" r="4" fill="#636366"/>
  <text x="222" y="332" font-family="sans-serif" font-size="11" fill="#636366" text-anchor="end">›</text>

  <line x1="36" y1="364" x2="228" y2="364" stroke="#38383a" stroke-width="0.5"/>
  <text x="40" y="384" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" font-weight="600" fill="#636366" letter-spacing="0.5">SESSIONS</text>

  <rect x="28" y="392" width="202" height="36" rx="8" fill="#0a84ff" opacity="0.2"/>
  <text x="52" y="415" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#0a84ff">Session 1</text>
  <rect x="28" y="434" width="202" height="36" rx="8" fill="none"/>
  <text x="52" y="457" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#ebebf5" opacity="0.6">Session 2</text>
  <rect x="194" y="442" width="28" height="18" rx="9" fill="#0a84ff"/>
  <text x="208" y="455" font-family="-apple-system, SF Pro Text, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">+</text>

  <!-- ===== MAIN CONTENT ===== -->
  <!-- Model config bar (collapsed) -->
  <rect x="248" y="124" width="916" height="40" rx="10" fill="#2c2c2e" stroke="#38383a" stroke-width="0.5"/>
  <text x="268" y="148" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="600" fill="#636366">▸  session [model] configuration</text>
  <text x="1130" y="148" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#636366" text-anchor="end">(per session)</text>

  <!-- Chat log area -->
  <rect x="248" y="172" width="916" height="470" rx="12" fill="#1c1c1e"/>

  <!-- User message (blue bubble, dark mode) -->
  <rect x="680" y="192" width="460" height="56" rx="16" fill="#0a84ff"/>
  <text x="700" y="215" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="white">What are the best practices for container</text>
  <text x="700" y="234" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="white">security in Kubernetes?</text>

  <!-- AI response bubble (dark card) -->
  <rect x="268" y="268" width="500" height="130" rx="16" fill="#2c2c2e"/>
  <text x="288" y="294" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="#f5f5f7">Here are key Kubernetes security practices:</text>
  <text x="288" y="318" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#ebebf5" opacity="0.8">1.  Use RBAC to restrict API access</text>
  <text x="288" y="338" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#ebebf5" opacity="0.8">2.  Enable Pod Security Standards</text>
  <text x="288" y="358" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#ebebf5" opacity="0.8">3.  Scan container images for vulnerabilities</text>
  <text x="288" y="378" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" fill="#ebebf5" opacity="0.8">4.  Use network policies to limit pod traffic</text>

  <!-- Copy button -->
  <rect x="776" y="296" width="32" height="32" rx="8" fill="#38383a"/>
  <text x="792" y="317" font-family="sans-serif" font-size="14" text-anchor="middle">📋</text>

  <!-- User msg 2 -->
  <rect x="700" y="418" width="440" height="40" rx="16" fill="#0a84ff"/>
  <text x="720" y="443" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="white">Can you show a NetworkPolicy example?</text>

  <!-- Code block response -->
  <rect x="268" y="478" width="560" height="130" rx="16" fill="#2c2c2e"/>
  <rect x="276" y="486" width="544" height="114" rx="10" fill="#141414"/>
  <text x="296" y="508" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#32d74b">apiVersion: networking.k8s.io/v1</text>
  <text x="296" y="526" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#32d74b">kind: NetworkPolicy</text>
  <text x="296" y="544" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#64d2ff">metadata:</text>
  <text x="296" y="562" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#f5f5f7">  name: allow-same-namespace</text>
  <text x="296" y="580" font-family="'SF Mono', 'Menlo', monospace" font-size="11" fill="#64d2ff">spec:</text>

  <!-- Input area -->
  <rect x="248" y="650" width="916" height="92" rx="12" fill="#2c2c2e" stroke="#38383a" stroke-width="0.5"/>

  <!-- Recent prompts -->
  <text x="266" y="670" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#636366">Recent</text>
  <rect x="316" y="657" width="220" height="22" rx="6" fill="#38383a"/>
  <text x="328" y="672" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#636366">-- Select a recent prompt --</text>

  <!-- Text input (dark) -->
  <rect x="260" y="683" width="720" height="36" rx="10" fill="#38383a"/>
  <text x="275" y="706" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#636366">Type your message here...</text>

  <!-- Send button -->
  <rect x="988" y="683" width="80" height="36" rx="10" fill="#0a84ff"/>
  <text x="1028" y="706" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Send ↑</text>

  <!-- Secondary action buttons -->
  <rect x="900" y="659" width="78" height="28" rx="8" fill="#38383a"/>
  <text x="940" y="677" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#ebebf5" opacity="0.7" text-anchor="middle">🎯 Focus</text>
  <rect x="820" y="659" width="74" height="28" rx="8" fill="#38383a"/>
  <text x="857" y="677" font-family="-apple-system, SF Pro Text, sans-serif" font-size="11" fill="#ebebf5" opacity="0.7" text-anchor="middle">💾 Save</text>

  <text x="600" y="790" font-family="-apple-system, SF Pro Text, sans-serif" font-size="13" fill="#636366" text-anchor="middle">Mockup: owrap (AI Chat) Tab — Apple-style Dark Mode</text>
</svg>
